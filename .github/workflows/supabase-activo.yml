name: Mantener activa la base de presupuestos

# El plan gratis de Supabase pausa el proyecto tras 7 días sin actividad: una consulta cada 3 días lo evita.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: src/presupuestos/supabase.json
          sparse-checkout-cone-mode: false
      - name: Consultar la base
        run: |
          url=$(jq -r .url src/presupuestos/supabase.json)
          key=$(jq -r .publishableKey src/presupuestos/supabase.json)
          curl -fsS --retry 3 -X POST "$url/rest/v1/rpc/ping" -H "apikey: $key" -H 'Content-Type: application/json' -d '{}'
